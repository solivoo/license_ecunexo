# Portainer: Compose path por defecto = docker-compose.yml (raíz del repo)
# Build context = raíz de license_ecunexo

name: ecunexo-licencias

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-licensing_ecunexo}
      POSTGRES_USER: ${POSTGRES_USER:-licensing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - licensing_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-licensing} -d ${POSTGRES_DB:-licensing_ecunexo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - licencias

  api:
    build:
      context: .
      dockerfile: ecunexo_license_api/Dockerfile
    image: ${LICENSE_API_IMAGE:-ecunexo-license-api:1.5.0}
    pull_policy: build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      Database__MigrateOnStartup: ${DATABASE_MIGRATE_ON_STARTUP:-true}
      ConnectionStrings__Licensing: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-licensing_ecunexo};Username=${POSTGRES_USER:-licensing};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: ${JWT_ISSUER:-EcuNexo}
      Jwt__Audience: ${JWT_AUDIENCE:-EcuNexo.Platform.Api}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY min 32 chars}
      ActivationCodes__IssuePepper: ${ISSUE_PEPPER:?set ISSUE_PEPPER}
      LicenseValidation__ValidationPepper: ${VALIDATION_PEPPER:?set VALIDATION_PEPPER}
      Licensing__ProvisioningEncryptionKey: ${PROVISIONING_ENCRYPTION_KEY:?set PROVISIONING_ENCRYPTION_KEY}
      LicenseSigning__PrivateKeyPath: ${LICENSE_PRIVATE_KEY_PATH:-/keys/license-private.pem}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-}
      # Primer operador (solo si la BD no tiene ninguno). Cámbialo tras el primer login.
      Bootstrap__Enabled: ${BOOTSTRAP_OPERATOR_ENABLED:-true}
      Bootstrap__Email: ${BOOTSTRAP_OPERATOR_EMAIL:-admin@ecunexo.local}
      Bootstrap__Password: ${BOOTSTRAP_OPERATOR_PASSWORD:-CambiaEstoYa123!}
      Bootstrap__DisplayName: ${BOOTSTRAP_OPERATOR_NAME:-Administrador}
    volumes:
      - ${LICENSE_KEYS_HOST_PATH:?set LICENSE_KEYS_HOST_PATH}:/keys:ro
    ports:
      - "${LICENSE_API_HOST_PORT:-5090}:8080"
    networks:
      - licencias

  spa:
    build:
      context: .
      dockerfile: ecunexo_license/Dockerfile
      args:
        # Vacío = mismo origen (Nginx proxy /api → api). Obligatorio detrás de Cloudflare HTTPS.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_LICENSE_SYNCFUSION: ${VITE_LICENSE_SYNCFUSION:-}
        VITE_LOGNERD_ENABLE_CONSOLE: ${VITE_LOGNERD_ENABLE_CONSOLE:-false}
        VITE_LOGNERD_LEVEL: ${VITE_LOGNERD_LEVEL:-WARN}
    image: ${LICENSE_SPA_IMAGE:-ecunexo-license-spa:1.5.0}
    pull_policy: build
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${LICENSE_SPA_HOST_PORT:-5174}:80"
    networks:
      - licencias

volumes:
  licensing_pg_data:

networks:
  licencias:
    driver: bridge
